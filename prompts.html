<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 프롬프트 | 계산 좀 해주세요!</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">CHECKOUT PLEASE!</a><nav><a href="index.html">게임 소개</a><a class="btn" href="game.html">게임 시작</a></nav></header><main><section><small>AI DEVELOPMENT LOG</small><h1>AI 활용 프롬프트 정리</h1><p>중간 과제 기획서를 기반으로 이번 웹 게임 구현에 적용한 요구 사항을 단계별 프롬프트 형태로 재구성했습니다. 실제 대화 원문을 옮긴 것은 아닙니다.</p><div id="prompts"></div></section></main><footer>계산 좀 해주세요! · 개발 프롬프트</footer><script>const prompts=[['기본 구조','HTML, CSS, JavaScript로 GitHub Pages에서 실행되는 편의점 계산 게임을 제작해 줘. 시작, 플레이, 결과 화면과 별도의 소개 및 프롬프트 페이지를 구성해 줘.'],['UI 디자인','기획서의 네이비와 노란색 UI를 참고하여 손님, 주문 목록, 상품 버튼, 영수증, 합계 및 타이머를 배치해 줘. 모바일에서도 조작할 수 있도록 만들어 줘.'],['상품 스캔','편의점 상품 8종을 구현하고 손님마다 1~4개 상품을 무작위로 주문하도록 해 줘. 클릭 시 스캔 목록과 합계를 갱신하고 취소 버튼을 제공해 줘.'],['돌발 이벤트','상품 추가, 상품 취소, 할인 쿠폰 이벤트를 구현해 줘. 결제 전에 요청을 표시하고 변경된 주문과 실제 스캔 목록이 일치하는지 검사해 줘. 쿠폰은 500원으로 설정해 줘.'],['시간과 점수','손님당 20초 제한, 정상 결제 100점, 10초 이내 추가 50점, 이벤트 성공 추가 50점을 적용해 줘. 실패는 0점으로 하고 성공 거래만 매출로 계산해 줘.'],['그래픽','기획서의 시작, 플레이, 결과 콘셉트 이미지를 소개 페이지에 활용해 줘. 실제 플레이는 별도의 이미지 생성 없이 상품과 손님을 이모지로 표현해 줘.'],['결과 및 재시작','10명 응대 후 점수, 성공 건수, 총매출, 오류 및 시간 초과 횟수를 표시해 줘. S/A/B/C 등급 기준을 설정하고 다시 도전 시 모든 상태를 초기화해 줘.'],['오류 검토 및 배포','중복 결제, 타이머 중복 실행, 쿠폰 중복 적용, 재시작 초기화를 점검할 수 있게 구성해 줘. 상대 경로를 사용해 GitHub Pages에서 실행 가능한 정적 파일로 패키징해 줘.']];prompts.forEach(([t,p],i)=>{const a=document.createElement('article');a.className='prompt';const h=document.createElement('h3');h.textContent=`${String(i+1).padStart(2,'0')} / ${t}`;const pre=document.createElement('pre');pre.textContent=p;const b=document.createElement('button');b.textContent='프롬프트 복사';b.onclick=async()=>{try{await navigator.clipboard.writeText(p);b.textContent='복사 완료'}catch(e){const r=document.createRange();r.selectNodeContents(pre);const s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택 완료 · 직접 복사'}};a.append(h,pre,b);document.querySelector('#prompts').append(a)});</script></body></html>
