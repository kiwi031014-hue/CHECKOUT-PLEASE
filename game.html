<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 플레이 | 계산 좀 해주세요!</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">CHECKOUT PLEASE!</a><nav><a href="index.html">게임 소개</a><a href="prompts.html">AI 프롬프트</a></nav></header><main><section id="start" class="center"><img src="assets/start.png" alt="게임 콘셉트" style="width:min(100%,700px);border-radius:16px"><h1>계산 좀 해주세요!</h1><p>손님이 요청한 상품을 아래 상품 버튼에서 클릭하세요.<br>잘못 스캔한 상품은 영수증의 − 버튼으로 취소할 수 있습니다.<br>돌발 요청은 결제 전 처리하세요. 손님당 20초!</p><button id="begin">근무 시작</button></section><section id="game" class="hidden"><div class="hud"><span id="customerNo"></span><span id="score"></span><span id="time"></span></div><div class="timer"><div id="bar"></div></div><div class="gamegrid"><div><div class="customer"><div id="face" class="face"></div><div class="bubble" id="order"></div></div><div id="event" class="event" hidden></div><div class="products" id="products"></div></div><div class="panel"><h3>POS · 스캔 목록</h3><div id="receipt" class="receipt"></div><div id="total" class="total"></div><button id="coupon" hidden>500원 쿠폰 적용</button> <button id="pay">결제하기</button><p id="status" class="status" role="status" aria-live="polite"></p><button id="next" hidden>다음 손님</button></div></div></section><section id="result" class="center hidden"><small>SHIFT COMPLETE</small><h1>퇴근 성공!</h1><div id="grade" class="big"></div><div id="stats" class="cards"></div><button id="retry">다시 도전하기</button> <a class="btn" href="index.html">메인 화면</a></section></main><script src="data.js"></script><script src="game.js"></script></body></html>
